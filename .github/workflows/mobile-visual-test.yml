name: Mobile visual smoke test
on:
  push:
    branches: [main]
    paths:
      - 'game-v06.js'
      - 'forest-v06.js'
      - 'motion-v06.js'
      - 'preview-v06.html'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/mobile-visual-test.yml'
  workflow_dispatch:
concurrency:
  group: ascension-visual-test
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  mobile-browsers:
    name: iPhone WebKit + Android Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegadores reais e dependencias
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps webkit chromium
      - name: Testar inicio, controle, animacoes e floresta
        run: node tests/mobile-smoke.cjs
      - name: Guardar capturas e relatorios para revisao visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-smoke
          path: test-output/
          retention-days: 7
      - name: Salvar capturas e diagnosticos no proprio repositorio
        if: always()
        run: |
          mkdir -p qa
          cp test-output/webkit-iphone-game.jpg qa/forest-iphone.jpg 2>/dev/null || true
          cp test-output/chromium-mobile-game.jpg qa/forest-android.jpg 2>/dev/null || true
          cp test-output/webkit-iphone-report.json qa/forest-iphone-report.json 2>/dev/null || true
          cp test-output/chromium-mobile-report.json qa/forest-android-report.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/
          if ! git diff --cached --quiet; then
            git commit -m "test: atualizar capturas reais da floresta"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
