name: Mobile visual smoke test
on:
  push:
    branches: [main]
    paths:
      - 'game-v06.js'
      - 'forest-v06.js'
      - 'motion-v06.js'
      - 'cache-v06.js'
      - 'preview-v06.html'
      - 'preview-v07.html'
      - 'game-v072.js'
      - 'illustrated-v07.js'
      - 'assets-data-v07.js'
      - 'tree-data-v07.js'
      - 'dom-tree-v07.js'
      - 'terrain-data-v07.js'
      - 'terrain-v07.js'
      - 'wind-v07.js'
      - 'clean-props-v07.js'
      - 'game-v08.js'
      - 'world-v08.js'
      - 'terrain-v08.js'
      - 'illustrated-v08.js'
      - 'wind-world-v08.js'
      - 'preview-v08.html'
      - 'preview-v09.html'
      - 'game-v09.js'
      - 'world-v09.js'
      - 'illustrated-v09.js'
      - 'combat-v09.js'
      - 'game-v10.js'
      - 'combat-v10.js'
      - 'illustrated-v10.js'
      - 'preview-v10.html'
      - 'katana-v11.js'
      - 'game-v11.js'
      - 'style-v11.css'
      - 'preview-v11.html'
      - 'game-v12.js'
      - 'illustrated-v12.js'
      - 'preview-v12.html'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/mobile-visual-test.yml'
  workflow_dispatch:
concurrency:
  group: ascension-visual-test
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mobile-browsers:
    name: iPhone WebKit + Android Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Registrar ID da execucao para diagnostico
        run: |
          mkdir -p qa
          echo "$GITHUB_RUN_ID" > qa/last-visual-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/last-visual-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: registrar execucao mobile"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegadores reais e dependencias
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4
          npx playwright install --with-deps webkit chromium
      - name: Testar inicio, controle, animacoes e floresta
        run: node tests/mobile-smoke-v11.cjs
      - name: Capturar sequencia de quadros para revisao artistica
        if: always()
        run: node tests/motion-review.cjs
      - name: Guardar capturas e relatorios para revisao visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-smoke
          path: test-output/
          retention-days: 7
      - name: Salvar capturas e diagnosticos no proprio repositorio
        if: always()
        run: |
          mkdir -p qa
          cp test-output/webkit-iphone-game.jpg qa/forest-iphone.jpg 2>/dev/null || true
          cp test-output/motion-review.png qa/motion-review.png 2>/dev/null || true
          cp test-output/motion-review.jpg qa/motion-review.jpg 2>/dev/null || true
          cp test-output/motion-review.json qa/motion-review.json 2>/dev/null || true
          cp test-output/webkit-iphone-katana-evolved.jpg qa/katana-iphone.jpg 2>/dev/null || true
          cp test-output/chromium-mobile-katana-evolved.jpg qa/katana-android.jpg 2>/dev/null || true
          rm -f qa/forest-iphone-FAILED.jpg qa/forest-android-FAILED.jpg
          cp test-output/webkit-iphone-FAILED.jpg qa/forest-iphone-FAILED.jpg 2>/dev/null || true
          cp test-output/chromium-mobile-FAILED.jpg qa/forest-android-FAILED.jpg 2>/dev/null || true
          cp test-output/chromium-mobile-game.jpg qa/forest-android.jpg 2>/dev/null || true
          cp test-output/webkit-iphone-report.json qa/forest-iphone-report.json 2>/dev/null || true
          cp test-output/chromium-mobile-report.json qa/forest-android-report.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/
          if ! git diff --cached --quiet; then
            git commit -m "test: atualizar capturas reais da floresta"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
