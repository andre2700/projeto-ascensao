name: Phaser prototype mobile check
on:
  push:
    branches: [main]
    paths:
      - 'phaser-next.html'
      - 'phaser-next.js'
      - 'tests/phaser-next-smoke.cjs'
      - 'phaser-lab.html'
      - 'phaser-lab.js'
      - 'tests/phaser-lab-smoke.cjs'
      - '.github/workflows/phaser-lab.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ascension-phaser-lab
  cancel-in-progress: false
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Registrar execução dos testes Phaser
        run: |
          mkdir -p qa
          echo "$GITHUB_RUN_ID" > qa/last-phaser-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/last-phaser-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "qa: registrar execução Phaser"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar browsers de teste
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit chromium
      - name: Testar Phaser WebKit e Chromium
        run: node tests/phaser-lab-smoke.cjs
      - name: Testar vertical slice Phaser Safari e Android
        run: node tests/phaser-next-smoke.cjs
      - name: Arquivar as capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-lab-mobile
          path: |
            test-output/phaser-lab-*
            test-output/phaser-next-*
          retention-days: 7
      - name: Salvar evidências no repositório
        if: always()
        run: |
          mkdir -p qa
          cp test-output/phaser-lab-iphone.jpg qa/phaser-lab-iphone.jpg 2>/dev/null || true
          cp test-output/phaser-lab-android.jpg qa/phaser-lab-android.jpg 2>/dev/null || true
          cp test-output/phaser-lab-report.json qa/phaser-lab-report.json 2>/dev/null || true
          cp test-output/phaser-next-iphone.jpg qa/phaser-next-iphone.jpg 2>/dev/null || true
          cp test-output/phaser-next-android.jpg qa/phaser-next-android.jpg 2>/dev/null || true
          cp test-output/phaser-next-report.json qa/phaser-next-report.json 2>/dev/null || true
          cp test-output/phaser-next-iphone-FAILED.jpg qa/phaser-next-iphone-FAILED.jpg 2>/dev/null || true
          cp test-output/phaser-next-android-FAILED.jpg qa/phaser-next-android-FAILED.jpg 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/phaser-lab-* qa/phaser-next-*
          if ! git diff --cached --quiet; then
            git commit -m "qa: evidencias do motor Phaser"
            git pull --rebase origin main
            git push origin HEAD:main
          fi