<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101424"><title>Projeto Ascensão — Protótipo</title><style>*{box-sizing:border-box}body{margin:0;background:#101424;color:#f7f4e9;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:10px 14px;pointer-events:none;text-shadow:0 2px 4px #000;z-index:2}#hud .top{display:flex;justify-content:space-between;font-weight:800;font-size:14px}.bar{height:9px;border:1px solid #ffffff55;border-radius:12px;overflow:hidden;background:#0008;margin-top:5px}.bar span{display:block;height:100%;width:100%;background:#e65e72}.bar.xp span{background:#65cfff}.small{font-size:12px;color:#ddd;margin-top:5px}#pause{position:fixed;right:12px;top:75px;z-index:3;background:#26324f;color:white;border:1px solid #ffffff66;border-radius:12px;padding:9px 13px;font-weight:bold}#overlay{position:fixed;inset:0;background:#070b17d9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5;overflow:auto}#overlay.hidden{display:none}.panel{background:#1c2540;border:1px solid #627397;border-radius:20px;max-width:500px;width:100%;padding:20px;box-shadow:0 20px 70px #0009}.panel h1{font-size:26px;margin:0 0 10px;color:#ffd776}.panel p{line-height:1.45;color:#d6dced}.btn{display:block;width:100%;text-align:left;border:1px solid #60718e;background:#293653;color:white;border-radius:13px;padding:13px 14px;margin:9px 0;font-size:15px;cursor:pointer}.btn b{display:block;color:#ffe4a0;margin-bottom:3px}.btn small{color:#d4d9e7}.btn:active{background:#445d87}.primary{text-align:center;background:#a36b2a;border-color:#ffd776;font-weight:800}.tip{font-size:12px;color:#aab6d0}#joystick{position:fixed;left:25px;bottom:35px;width:112px;height:112px;border:2px solid #ffffff40;border-radius:50%;background:#ffffff12;pointer-events:none;z-index:2;display:none}#knob{position:absolute;width:46px;height:46px;left:31px;top:31px;border-radius:50%;background:#ffffff70;border:2px solid #fff7}@media(pointer:coarse){#joystick{display:block}}#dpad{position:fixed;right:14px;bottom:max(24px,env(safe-area-inset-bottom));z-index:4;display:grid;grid-template-columns:repeat(3,54px);gap:5px;touch-action:none}#dpad button{height:54px;border-radius:13px;background:#263b5bdc;border:1px solid #a6c8e5;color:white;font-size:24px;font-weight:800;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#dpad button:active,#dpad button.held{background:#eab54b;color:#17223a}#dpad .blank{visibility:hidden}@media(pointer:fine){#dpad{opacity:.65}}#joystick{display:none!important}#dpad{display:none!important}#joystick{display:none;pointer-events:none!important;opacity:0}#joystick.active{display:block!important;opacity:1}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><span id="time">00:00</span><span id="lvl">Nível 1</span><span id="kills">0 eliminações</span></div><div class="bar"><span id="hpbar"></span></div><div class="bar xp"><span id="xpbar"></span></div><div class="small" id="stats">⚔️ Espada 1 · ✨ Sem encantamentos</div></div><button id="pause">Ⅱ</button><div id="joystick"><div id="knob"></div></div><div id="dpad" aria-label="Controles direcionais"><span class="blank"></span><button data-dir="ArrowUp" aria-label="Cima">▲</button><span class="blank"></span><button data-dir="ArrowLeft" aria-label="Esquerda">◀</button><span></span><button data-dir="ArrowRight" aria-label="Direita">▶</button><span class="blank"></span><button data-dir="ArrowDown" aria-label="Baixo">▼</button><span class="blank"></span></div><div id="overlay"><div class="panel" id="panel"></div></div><script>
(()=>{'use strict';const cv=document.querySelector('#game'),ctx=cv.getContext('2d'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel'),joy=document.querySelector('#joystick'),knob=document.querySelector('#knob');let W,H,dpr,last=0,run=null,mode='menu',keys={},touch=null,elapsed=0,spawn=0,attack=0,orbs=[],enemies=[],shots=[],effects=[],levelups=0;const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const options=[{id:'sword',name:'⚔️ Evoluir Espada',desc:'Ataques mais fortes. Níveis ilimitados.'},{id:'fire',name:'🔥 Encantar com Fogo',desc:'Dano adicional e queimadura.'},{id:'ice',name:'❄️ Encantar com Gelo',desc:'Dano adicional e lentidão.'},{id:'lightning',name:'⚡ Encantar com Raio',desc:'Descargas elétricas adicionais.'},{id:'area',name:'🌀 Área Global',desc:'Aumenta alcance e tamanho dos efeitos.'},{id:'speed',name:'👟 Velocidade',desc:'Movimentação mais rápida.'},{id:'reload',name:'⏱️ Recarga',desc:'Ataca mais vezes.'},{id:'heal',name:'❤️ Vitalidade',desc:'Mais vida máxima e recuperação.'},{id:'multi',name:'✨ Projéteis',desc:'Mais ataques a cada disparo.'},{id:'storm',name:'🌪️ Tempestade Ardente',desc:'Transformação: explosões de fogo em área.'}];function show(html){panel.innerHTML=html;overlay.classList.remove('hidden')}function hide(){overlay.classList.add('hidden')}function menu(){mode='menu';show('<h1>⚔️ PROJETO ASCENSÃO</h1><p><b>Protótipo jogável — Arena Elemental</b></p><p>Sobreviva às hordas, colete cristais de experiência e crie uma build poderosa. Uma primeira experiência curta para testar o combate.</p><p class="tip">📱 Arraste o dedo na tela para movimentar. 💻 Use WASD ou setas. Os ataques são automáticos.</p><button class="btn primary" id="start">COMEÇAR PARTIDA</button><p class="tip">Meta do protótipo: sobreviver 3 minutos e derrotar o Guardião. A versão final terá modos de duração diferentes.</p>');$('start').onclick=startGame}function startGame(){run={p:{x:W/2,y:H/2,r:15,hp:100,maxHp:100,speed:195},xp:0,need:7,level:1,kills:0,sword:1,fire:0,ice:0,lightning:0,area:0,reload:0,multi:0,storm:0,score:0,boss:false,bossDead:false};elapsed=0;spawn=0;attack=0;orbs=[];enemies=[];shots=[];effects=[];levelups=0;mode='play';hide();updateHUD()}function updateHUD(){if(!run)return;let p=run.p;$('time').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(Math.floor(elapsed%60)).padStart(2,'0')}`;$('lvl').textContent='Nível '+run.level;$('kills').textContent=run.kills+' eliminações';$('hpbar').style.width=(100*p.hp/p.maxHp)+'%';$('xpbar').style.width=(100*run.xp/run.need)+'%';$('stats').textContent=`⚔️ Espada ${run.sword} · 🔥 ${run.fire} · ❄️ ${run.ice} · ⚡ ${run.lightning} · 🌀 ${run.area} · 🌪️ ${run.storm}`}
function upgradeScreen(){mode='upgrade';let pool=options.filter(o=>o.id!=='storm'||(run.fire>0&&run.area>0));let picks=[];while(picks.length<3&&pool.length){let i=Math.floor(Math.random()*pool.length);picks.push(pool.splice(i,1)[0])}const rarities=[['Comum',1,0.66],['Rara',2,0.24],['Épica',3,0.085],['Lendária',5,0.015]];show(`<h1>✨ Nível ${run.level}!</h1><p>Escolha uma melhoria para sua build:</p><div id="choices"></div>`);let choices=$('choices');picks.forEach(o=>{let r=Math.random(),acc=0,rar=rarities[0];for(let t of rarities){acc+=t[2];if(r<=acc){rar=t;break}}let btn=document.createElement('button');btn.className='btn';btn.innerHTML=`<b>${o.name} <span style="float:right;color:#8ed5ff;font-size:12px">${rar[0]}</span></b><small>${o.desc} (+${rar[1]} nível${rar[1]>1?'is':''})</small>`;btn.onclick=()=>{apply(o.id,rar[1]);hide();mode='play';updateHUD();if(levelups>0){levelups--;upgradeScreen()}};choices.append(btn)})}function apply(id,n){if(id==='heal'){run.p.maxHp+=20*n;run.p.hp=Math.min(run.p.maxHp,run.p.hp+30*n)}else if(id==='speed'){run.p.speed+=17*n}else{run[id]+=n}}function addXp(n){run.xp+=n;while(run.xp>=run.need){run.xp-=run.need;run.level++;run.need=Math.floor(run.need*1.22+3);levelups++}if(levelups&&mode==='play'){levelups--;upgradeScreen()}}function spawnEnemy(boss=false){let side=Math.floor(Math.random()*4),x=side===0?-30:side===1?W+30:rnd(0,W),y=side===2?-30:side===3?H+30:rnd(0,H),t=elapsed;enemies.push({x,y,r:boss?39:rnd(10,16),hp:boss?1200:15+t*.65,maxHp:boss?1200:15+t*.65,speed:boss?55:rnd(35,65)+Math.min(t*.12,28),damage:boss?24:8,kind:boss?'boss':Math.random()<.22?'fast':'normal',burn:0,slow:0});if(!boss&&enemies.at(-1).kind==='fast'){let e=enemies.at(-1);e.speed*=1.65;e.hp*=.65;e.maxHp=e.hp}}function hit(e,dmg,kind){e.hp-=dmg;effects.push({x:e.x,y:e.y,t:.28,r:5,color:kind==='fire'?'#ff923c':kind==='ice'?'#7de5ff':kind==='lightning'?'#e9e97e':'#ffe2a4'});if(kind==='fire')e.burn=Math.max(e.burn,2.8);if(kind==='ice')e.slow=Math.max(e.slow,2.5);if(e.hp<=0){run.kills++;run.score+=e.kind==='boss'?100:1;orbs.push({x:e.x,y:e.y,r:e.kind==='boss'?11:5,val:e.kind==='boss'?35:1});if(e.kind==='boss'){run.bossDead=true;win()}else if(run.storm&&Math.random()<.22){effects.push({x:e.x,y:e.y,t:.6,r:35+run.area*6,color:'#ff813a',boom:true});for(let other of enemies)if(other!==e&&dist(other,e)<60+run.area*7)other.hp-=10+run.storm*8}}}function shoot(){if(!enemies.length)return;let near=enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a,run.p)-dist(b,run.p)).slice(0,1+run.multi);for(let e of near){let dx=e.x-run.p.x,dy=e.y-run.p.y,l=Math.hypot(dx,dy)||1;shots.push({x:run.p.x,y:run.p.y,vx:dx/l*460,vy:dy/l*460,r:5+run.area*.5,life:1.6})}}function win(){mode='won';show(`<h1>🏆 GUARDIÃO DERROTADO!</h1><p>Você venceu a Arena Elemental!</p><p><b>Nível:</b> ${run.level}<br><b>Eliminações:</b> ${run.kills}<br><b>Espada:</b> ${run.sword}<br><b>Encantamentos:</b> 🔥${run.fire} ❄️${run.ice} ⚡${run.lightning}</p><p>Esta é apenas a primeira amostra do combate. As transformações, reações e progressão serão aprofundadas nas próximas versões.</p><button class="btn primary" id="again">JOGAR NOVAMENTE</button>`);$('again').onclick=startGame}function lose(){mode='lost';show(`<h1>💀 Fim da tentativa</h1><p>Você alcançou o nível ${run.level} e derrotou ${run.kills} inimigos em ${Math.floor(elapsed)} segundos.</p><p>Sem penalidade: cada tentativa serve para experimentar uma nova build.</p><button class="btn primary" id="again">TENTAR NOVAMENTE</button>`);$('again').onclick=startGame}
function step(dt){if(mode!=='play')return;elapsed+=dt;let p=run.p,vx=0,vy=0;if(keys.w||keys.arrowup)vy--;if(keys.s||keys.arrowdown)vy++;if(keys.a||keys.arrowleft)vx--;if(keys.d||keys.arrowright)vx++;if(touch){vx+=touch.dx;vy+=touch.dy}let l=Math.hypot(vx,vy);if(l>0){let power=Math.min(1,l);p.x+=vx/l*p.speed*power*dt;p.y+=vy/l*p.speed*power*dt}p.x=Math.max(18,Math.min(W-18,p.x));p.y=Math.max(45,Math.min(H-18,p.y));spawn-=dt;let interval=Math.max(.17,.85-elapsed*.0028);if(spawn<=0){spawn=interval;for(let i=0;i<1+Math.floor(elapsed/55);i++)if(enemies.length<180)spawnEnemy()}if(elapsed>=165&&!run.boss){run.boss=true;spawnEnemy(true)}attack-=dt;if(attack<=0){attack=Math.max(.13,.8/(1+run.reload*.11));shoot()}for(let e of enemies){if(e.hp<=0)continue;let dx=p.x-e.x,dy=p.y-e.y,dd=Math.hypot(dx,dy)||1;e.x+=dx/dd*e.speed*(e.slow>0?.55:1)*dt;e.y+=dy/dd*e.speed*(e.slow>0?.55:1)*dt;if(e.burn>0){e.burn-=dt;e.hp-=dt*(4+run.fire*3)}if(e.slow>0)e.slow-=dt;if(dd<p.r+e.r){p.hp-=e.damage*dt*1.5;if(p.hp<=0){p.hp=0;lose();break}}}enemies=enemies.filter(e=>e.hp>0);for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let e of enemies){if(dist(s,e)<s.r+e.r){let dmg=12+run.sword*7;hit(e,dmg,'physical');if(run.fire)hit(e,run.fire*3,'fire');if(run.ice)hit(e,run.ice*2,'ice');if(run.lightning){hit(e,run.lightning*4,'lightning');if(Math.random()<.2)for(let n of enemies)if(n!==e&&dist(n,e)<90+run.area*7)n.hp-=run.lightning*3}s.life=0;break}}}shots=shots.filter(s=>s.life>0);for(let o of orbs){let dd=dist(o,p);if(dd<110+run.area*5){o.x+=(p.x-o.x)/Math.max(dd,1)*Math.min(420*dt,dd);o.y+=(p.y-o.y)/Math.max(dd,1)*Math.min(420*dt,dd)}if(dd<23){o.dead=true;addXp(o.val)}}orbs=orbs.filter(o=>!o.dead);for(let ef of effects)ef.t-=dt;effects=effects.filter(e=>e.t>0);updateHUD()}
function draw(){ctx.fillStyle='#182739';ctx.fillRect(0,0,W,H);let grid=48;ctx.strokeStyle='#ffffff09';ctx.lineWidth=1;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let o of orbs){ctx.fillStyle=o.val>1?'#ffdb68':'#63d9fa';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()}for(let e of enemies){ctx.fillStyle=e.kind==='boss'?'#9a58cf':e.kind==='fast'?'#ffac58':'#da6570';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0009';ctx.lineWidth=2;ctx.stroke();if(e.kind==='boss'){ctx.fillStyle='#000a';ctx.fillRect(e.x-42,e.y-e.r-15,84,7);ctx.fillStyle='#f57b92';ctx.fillRect(e.x-42,e.y-e.r-15,84*Math.max(0,e.hp/e.maxHp),7)}if(e.burn>0){ctx.strokeStyle='#ff943e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,Math.PI*2);ctx.stroke()}if(e.slow>0){ctx.strokeStyle='#76e6ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+6,0,Math.PI*2);ctx.stroke()}}for(let s of shots){ctx.fillStyle='#ffe4a5';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}for(let ef of effects){ctx.globalAlpha=Math.min(1,ef.t*3);ctx.strokeStyle=ef.color;ctx.lineWidth=ef.boom?4:2;ctx.beginPath();ctx.arc(ef.x,ef.y,ef.r*(1.4-ef.t*.5),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}if(run){let p=run.p;ctx.fillStyle='#66d4b4';ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e7fff7';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#123d44';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText('⚔',p.x,p.y-24)}}function loop(t){let dt=Math.min((t-last)/1000||0,.05);last=t;step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let tid=null,startX=0,startY=0;cv.addEventListener('pointerdown',e=>{if(mode!=='play')return;tid=e.pointerId;startX=e.clientX;startY=e.clientY;touch={dx:0,dy:0};joy.classList.add('active');cv.setPointerCapture(tid);joy.style.left=(startX-56)+'px';joy.style.top=(startY-56)+'px';joy.style.bottom='auto'});cv.addEventListener('pointermove',e=>{if(e.pointerId!==tid||!touch)return;let dx=e.clientX-startX,dy=e.clientY-startY,l=Math.hypot(dx,dy),m=Math.min(l,45);touch.dx=dx/Math.max(45,l);touch.dy=dy/Math.max(45,l);knob.style.transform=`translate(${touch.dx*m}px,${touch.dy*m}px)`});function end(e){if(e.pointerId===tid){tid=null;touch=null;joy.classList.remove('active');knob.style.transform='translate(0,0)';joy.style.left='25px';joy.style.top='auto';joy.style.bottom='35px'}}cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);$('pause').onclick=()=>{if(mode==='play'){mode='paused';show('<h1>⏸️ Pausa</h1><p>O combate está pausado.</p><button class="btn primary" id="resume">CONTINUAR</button><button class="btn" id="exit">ENCERRAR TENTATIVA</button>');$('resume').onclick=()=>{mode='play';hide()};$('exit').onclick=menu()}else if(mode==='paused'){mode='play';hide()}};menu()})();
</script><script>(function(){document.querySelectorAll('#dpad button[data-dir]').forEach(b=>{const k=b.dataset.dir;function press(e){e.preventDefault();b.classList.add('held');dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true}));try{b.setPointerCapture(e.pointerId)}catch(_){}}function release(e){if(e.cancelable)e.preventDefault();b.classList.remove('held');dispatchEvent(new KeyboardEvent('keyup',{key:k,bubbles:true}))}b.addEventListener('pointerdown',press);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,release));b.addEventListener('contextmenu',e=>e.preventDefault())})})();</script></body></html>
