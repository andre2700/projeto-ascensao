const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});const el=id=>document.getElementById(id);
const atlas=new Image(),bg=new Image();atlas.src=data.atlas;bg.src=data.background;
let ww=window.innerWidth,hh=window.innerHeight,dpr=1;
function resize(){ww=innerWidth;hh=innerHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(ww*dpr);canvas.height=Math.round(hh*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}resize();addEventListener('resize',resize);
const smooth=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let last=0,time=0,attack=null,queue=null,elapsed=0,auto=false,slow=1;
const key={};let pointer=-1,joy={x:0,y:0},center={x:0,y:0},facing=1,hitcount=0;const random=(n)=>{const x=Math.sin(n*73.17+2.73)*43758.5453;return x-Math.floor(x)};
let player={x:620,y:480,vx:0,vy:0,motion:0,state:'GUARDA',walkCycle:0};const dummies=[{x:854,y:480,hp:7,flash:0,dead:0},{x:490,y:363,hp:7,flash:0,dead:0},{x:900,y:605,hp:7,flash:0,dead:0}];const particles=[];const labels=[];let camera={x:0,y:0};
function reset(){player={x:620,y:480,vx:0,vy:0,motion:0,state:'GUARDA',walkCycle:0};attack=null;queue=null;elapsed=0;hitcount=0;el('hits').textContent='0';dummies.forEach(d=>{d.hp=7;d.flash=0;d.dead=0})}
el('reset').onclick=reset;el('demo').onclick=()=>{auto=!auto;el('demo').textContent='AUTO: '+(auto?'ON':'OFF')};el('slow').onclick=()=>{slow=slow===1?.5:1;el('slow').textContent='TEMPO: '+(slow===1?'1×':'½×')};
for(const type of ['light','heavy'])el(type).addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();queue=type});
addEventListener('keydown',e=>{key[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' ')queue='light'});addEventListener('keyup',e=>{key[e.key.toLowerCase()]=false});addEventListener('blur',()=>{Object.keys(key).forEach(k=>key[k]=false);joy.x=joy.y=0});
canvas.addEventListener('pointerdown',e=>{if(e.clientX>ww-160&&e.clientY>hh-140)return;if(pointer>=0)return;pointer=e.pointerId;center={x:e.clientX,y:e.clientY};el('joystick').style.cssText='display:block;left:'+(center.x-54)+'px;top:'+(center.y-54)+'px';stick(e)});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===pointer)stick(e)});function stick(e){const dx=e.clientX-center.x,dy=e.clientY-center.y,r=Math.hypot(dx,dy)||1,n=Math.min(1,r/43);joy.x=dx/r*n;joy.y=dy/r*n;el('knob').style.transform='translate('+(joy.x*36)+'px,'+(joy.y*36)+'px)'}function release(e){if(e.pointerId===pointer){pointer=-1;joy.x=joy.y=0;el('joystick').style.display='none'}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function begin(type){if(attack)return;const dur=type==='heavy'?.72:.48;attack={type,t:0,dur,hit:false,dir:facing,origin:{x:player.x,y:player.y}};player.state=type==='heavy'?'ATAQUE FORTE':'ATAQUE LEVE'}
function burst(x,y,color,amount=14){for(let i=0;i<amount;i++){const a=random(i*5+elapsed*123)*Math.PI*2,sp=30+random(i*17+elapsed*91)*110;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-25,life:.26+random(i+elapsed*45)*.38,max:.64,c:color,size:1+random(i+elapsed*44)*3})}}
function contact(){if(!attack||attack.hit)return;attack.hit=true;const impactX=player.x+facing*82,impactY=player.y-57;const radius=attack.type==='heavy'?138:108;
let impacted=false;for(const e of dummies){if(e.dead>0||e.hp<=0)continue;const dx=e.x-player.x,dy=e.y-player.y;if(Math.hypot(dx,dy)>radius||dx*facing<8||Math.abs(dy)>95)continue;e.hp-=attack.type==='heavy'?3:2;e.flash=.18;impacted=true;e.x+=facing*7;hitcount++;el('hits').textContent=String(hitcount);burst(e.x,e.y-54,'#ffd8a0',19);labels.push({x:e.x,y:e.y-100,t:0,text:attack.type==='heavy'?'32':'18'});if(e.hp<=0){e.dead=1.35;burst(e.x,e.y-70,'#79d3d7',26)}}if(!impacted)burst(impactX,impactY,'#a6e6fd',4)}
function step(dt){time+=dt;elapsed+=dt;let dx=Number(!!(key.d||key.arrowright))-Number(!!(key.a||key.arrowleft))+joy.x;let dy=Number(!!(key.s||key.arrowdown))-Number(!!(key.w||key.arrowup))+joy.y;let speed=Math.hypot(dx,dy),manual=speed>.10;
if(!manual&&auto){const phase=elapsed%9.7;
  // Stand, run up to training dummy, swing, recover, return to starting position.
  if(phase<1.5){dx=0;dy=0}
  else if(phase<2.37){dx=1;dy=0}
  else if(phase<4.7){dx=0;dy=0}
  else if(phase<5.6){dx=-1;dy=0}
  else{dx=0;dy=0}
  speed=Math.hypot(dx,dy);
  if((phase>2.45&&phase<2.52)||(phase>3.43&&phase<3.50)){
    if(!attack)begin(phase>3?'heavy':'light');
  }
 }
if(speed>.001){dx/=speed;dy/=speed}const max=attack?85:177,lerp=1-Math.exp(-dt*13);player.vx=smooth(player.vx,dx*max*clamp(speed,0,1),lerp);player.vy=smooth(player.vy,dy*max*clamp(speed,0,1),lerp);const ox=player.x,oy=player.y;player.x=clamp(player.x+player.vx*dt,110,1165);player.y=clamp(player.y+player.vy*dt,160,880);const travel=Math.hypot(player.x-ox,player.y-oy);if(travel>.04)player.walkCycle+=travel/19;if(Math.abs(player.vx)>30&&(!attack||attack.t<.06))facing=player.vx>0?1:-1;
if(queue&&!attack){begin(queue);queue=null}if(attack){attack.t+=dt;const progress=attack.t/attack.dur;if(progress>=.42&&!attack.hit)contact();if(progress>=1)attack=null}
if(attack){player.state=attack.type==='heavy'?'ATAQUE FORTE':'ATAQUE LEVE'}else{player.state=travel>dt*30?'CORRIDA':'GUARDA'}el('state').textContent=player.state;
for(const d of dummies){d.flash=Math.max(0,d.flash-dt);if(d.dead>0){d.dead-=dt;if(d.dead<=0){d.hp=7;d.x=d===dummies[0]?785:d===dummies[1]?490:900;d.dead=0}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*2;p.vy+=dt*80;if(p.life<=0)particles.splice(i,1)}for(let i=labels.length-1;i>=0;i--){labels[i].t+=dt;labels[i].y-=dt*35;if(labels[i].t>.8)labels.splice(i,1)}camera.x=smooth(camera.x,player.x-ww/2,1-Math.exp(-dt*4));camera.y=smooth(camera.y,player.y-hh/2,1-Math.exp(-dt*4))}
function drawSprite(row,frame,x,y){const w=106,h=132,dw=172,dh=211;ctx.save();ctx.translate(Math.round(x),Math.round(y));if(facing<0)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(atlas,frame*w,row*h,w,h,-dw/2,-dh+10,dw,dh);ctx.restore()}
function drawDummy(e){const dead=e.dead>0;ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));ctx.globalAlpha=dead?clamp(1-e.dead*1.8,0,1):1;ctx.fillStyle='#020c12a0';ctx.beginPath();ctx.ellipse(0,5,28,9,0,0,Math.PI*2);ctx.fill();const rock=e.flash>0?'#fff7dd':'#454d4c';ctx.fillStyle='#242e30';ctx.fillRect(-22,-52,46,52);ctx.fillStyle=rock;ctx.beginPath();ctx.moveTo(-27,-70);ctx.lineTo(-17,-86);ctx.lineTo(18,-91);ctx.lineTo(29,-76);ctx.lineTo(26,-29);ctx.lineTo(12,-16);ctx.lineTo(-21,-21);ctx.closePath();ctx.fill();ctx.strokeStyle='#161f26';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#787e71';ctx.fillRect(-11,-75,8,4);ctx.fillRect(5,-79,10,4);ctx.strokeStyle='#48a6c5';ctx.lineWidth=3;ctx.shadowBlur=15;ctx.shadowColor='#49d8eb';ctx.beginPath();ctx.moveTo(-11,-50);ctx.lineTo(1,-65);ctx.lineTo(13,-46);ctx.lineTo(0,-33);ctx.lineTo(-11,-50);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#101819';ctx.fillRect(-22,-100,44,6);ctx.fillStyle='#a5dfe4';ctx.fillRect(-22,-100,44*Math.max(0,e.hp)/7,6);ctx.restore()}
function drawTrail(){if(!attack)return;const p=attack.t/attack.dur,start=attack.type==='heavy'?.24:.23,end=attack.type==='heavy'?.75:.76;if(p<start||p>end)return;const q=(p-start)/(end-start),sign=facing;const radius=attack.type==='heavy'?92:76;const ox=player.x+sign*22,oy=player.y-66;const hue=attack.type==='heavy'?'#ad8df8':'#bbf4ff';const a0=(-1.5+q*2.2)*sign,a1=(a0-.41*sign);ctx.save();ctx.translate(ox,oy);ctx.scale(sign,1);const alpha=Math.min(1,q*7,(1-q)*7);ctx.lineCap='round';for(let i=3;i>=0;i--){ctx.globalAlpha=alpha*[.08,.25,.54,1][i];ctx.strokeStyle=i===3?'#fff8e7':hue;ctx.lineWidth=[29,17,8,3.5][i];ctx.shadowColor=hue;ctx.shadowBlur=i===3?10:0;ctx.beginPath();ctx.arc(0,0,radius-i*3,-1.55+q*2.05,-1.2+q*2.05);ctx.stroke()}ctx.restore()}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#07151a';ctx.fillRect(0,0,ww,hh);ctx.save();ctx.translate(-Math.round(camera.x),-Math.round(camera.y));if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,1424,1024);else{ctx.fillStyle='#29382b';ctx.fillRect(0,0,1424,1024)}
const vignette=ctx.createRadialGradient(player.x,player.y,70,player.x,player.y,480);vignette.addColorStop(0,'#e6b05b05');vignette.addColorStop(.95,'#00101450');ctx.fillStyle=vignette;ctx.fillRect(0,0,1424,1024);
for(const d of dummies)drawDummy(d);ctx.save();ctx.fillStyle='#050b0caa';ctx.beginPath();ctx.ellipse(player.x,player.y+2,40,12,0,0,Math.PI*2);ctx.fill();ctx.restore();let row=0,frame=0;
if(attack){row=attack.type==='heavy'?3:2;frame=Math.min(row===3?8:7,Math.floor(attack.t/attack.dur*(row===3?9:8)))}else if(player.state==='CORRIDA'){row=1;frame=Math.floor(player.walkCycle)%8}else{row=0;frame=Math.floor(time*3.4)%9}
if(atlas.complete&&atlas.naturalWidth)drawSprite(row,frame,player.x,player.y);drawTrail();for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;for(const l of labels){ctx.font='bold 20px Georgia';ctx.textAlign='center';ctx.fillStyle='#fff6d8';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillText(l.text,l.x,l.y);ctx.shadowBlur=0}ctx.restore()}
function loop(ts){const dt=Math.min(.044,(ts-last||16)/1000)*slow;last=ts;step(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.AscensionMotionStudy={debug:()=>({player,state:player.state,attack:attack?.type||null,hits:hitcount,atlasLoaded:atlas.complete&&atlas.naturalWidth>0,backgroundLoaded:bg.complete&&bg.naturalWidth>0,frames:{idle:9,run:8,light:8,heavy:9},auto})};
</script></body></html>
